  <rect x="104" y="304" width="88"  height="12" rx="6" fill="rgba(255,255,255,0.42)"/>
  <!-- Right page text lines -->
  <rect x="296" y="176" width="112" height="12" rx="6" fill="rgba(255,255,255,0.42)"/>
